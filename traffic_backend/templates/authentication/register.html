<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Traffic System - Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #0a0f1e 0%, #1a2540 100%);
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
}
.navbar {
    background: rgba(17, 24, 39, 0.95) !important;
    border-bottom: 1px solid #1e2d4a;
    padding: 15px 30px;
}
.navbar-brand {
    color: #38bdf8 !important;
    font-size: 22px;
    font-weight: bold;
}
.nav-link { color: #e2e8f0 !important; font-size: 15px; }
.register-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 88vh;
    padding: 20px;
}
.register-card {
    background: #111827;
    border: 1px solid #38bdf8;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}
.register-card h3 {
    color: white;
    font-size: 26px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 8px;
}
.register-card .subtitle {
    color: #64748b;
    text-align: center;
    font-size: 14px;
    margin-bottom: 28px;
}
.form-label { color: #94a3b8; font-size: 14px; margin-bottom: 6px; }
.form-control {
    background: #0a0f1e !important;
    border: 1px solid #1e2d4a !important;
    color: #e2e8f0 !important;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
}
.form-control:focus {
    border-color: #38bdf8 !important;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.15) !important;
}
.form-control::placeholder { color: #475569 !important; }
.btn-register {
    background: #22c55e;
    border: none;
    color: #000;
    font-weight: bold;
    padding: 12px;
    border-radius: 8px;
    width: 100%;
    font-size: 15px;
    transition: all 0.2s;
    margin-top: 8px;
}
.btn-register:hover {
    background: #16a34a;
    transform: translateY(-1px);
}
.login-link {
    color: #64748b;
    font-size: 14px;
    text-align: center;
    margin-top: 20px;
}
.login-link a { color: #38bdf8; text-decoration: none; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="#">🚦 Smart Traffic System</a>
        <div class="ms-auto">
            <a class="nav-link d-inline" href="{% url 'login' %}">Login</a>
        </div>
    </div>
</nav>

<!-- Register Form -->
<div class="register-wrapper">
    <div class="register-card">
        <h3>Create Account</h3>
        <p class="subtitle">Join the Smart Traffic Monitoring System</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show py-2 mb-3"
                    style="font-size: 13px; border-radius: 8px;">
                    {{ message }}
                    <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username"
                    placeholder="Choose a username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" name="email"
                    placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password1"
                    placeholder="Create a password (min 8 chars)" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" name="password2"
                    placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="btn-register">Create Account →</button>

            <div class="login-link">
                Already have an account? <a href="{% url 'login' %}">Login here</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
