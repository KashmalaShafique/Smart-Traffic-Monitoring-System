<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ action }} Incident</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #0a0f1e; color: #e2e8f0; padding: 30px; min-height: 100vh; }
.card { background: #111827; border: 1px solid #1e2d4a; }
.form-control, .form-select { background: #0a0f1e !important; border: 1px solid #1e2d4a !important; color: #e2e8f0 !important; }
.form-label { color: #94a3b8; }
h3 { color: #38bdf8; }
</style>
</head>
<body>
<div class="container" style="max-width: 600px; margin-top: 50px;">
    <div class="card p-4">
        <h3>{{ action }} Traffic Incident</h3>
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control"
                    value="{{ incident.location|default:'' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" required>{{ incident.description|default:'' }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Severity</label>
                <select name="severity" class="form-select">
                    <option value="LOW" {% if incident.severity == 'LOW' %}selected{% endif %}>Low</option>
                    <option value="MEDIUM" {% if incident.severity == 'MEDIUM' %}selected{% endif %}>Medium</option>
                    <option value="HIGH" {% if incident.severity == 'HIGH' %}selected{% endif %}>High</option>
                </select>
            </div>

            {% if action == 'Update' %}
            <div class="mb-3 form-check">
                <input type="checkbox" name="is_resolved" class="form-check-input"
                    {% if incident.is_resolved %}checked{% endif %}>
                <label class="form-check-label">Resolved</label>
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary w-100">{{ action }}</button>
            <a href="{% url 'incident_list' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
