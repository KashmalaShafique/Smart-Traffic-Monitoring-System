<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delete Incident</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #0a0f1e 0%, #1a2540 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
}
.delete-card {
    background: #111827;
    border: 1px solid #ef4444;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 50px rgba(239, 68, 68, 0.15);
    text-align: center;
}
.icon {
    font-size: 56px;
    margin-bottom: 16px;
}
.delete-card h4 {
    color: #ffffff !important;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 12px;
}
.incident-info {
    background: #0a0f1e;
    border: 1px solid #1e2d4a;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 24px;
    color: #e2e8f0 !important;
    font-size: 15px;
}
.btn-delete {
    background: #ef4444;
    border: none;
    color: white;
    font-weight: bold;
    padding: 12px;
    border-radius: 8px;
    width: 100%;
    font-size: 15px;
    transition: all 0.2s;
}
.btn-delete:hover { background: #dc2626; transform: translateY(-1px); }
.btn-cancel {
    background: transparent;
    border: 1px solid #1e2d4a;
    color: #94a3b8 !important;
    font-weight: bold;
    padding: 12px;
    border-radius: 8px;
    width: 100%;
    font-size: 15px;
    margin-top: 10px;
    display: block;
    text-decoration: none;
    transition: all 0.2s;
}
.btn-cancel:hover { background: #1e2d4a; color: #e2e8f0 !important; }
</style>
</head>
<body>
<div class="delete-card">
    <div class="icon">⚠️</div>
    <h4>Delete this incident?</h4>
    <div class="incident-info">
        <strong>{{ incident.location }}</strong> — {{ incident.severity }}
    </div>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn-delete">Yes, Delete Permanently</button>
    </form>
    <a href="{% url 'incident_list' %}" class="btn-cancel">Cancel</a>
</div>
</body>
</html>
